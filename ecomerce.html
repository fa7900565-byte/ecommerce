<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopwise - Online Store</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --brand: #4f46e5;
    --brand-text: #ffffff;
    --ok: #10b981;
    --shadow: 0 6px 24px rgba(0, 0, 0, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1020;
      --surface: #151b2e;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --line: #26304a;
      --brand: #818cf8;
      --brand-text: #0b1020;
      --shadow: 0 6px 24px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .muted { color: var(--muted); }
  [hidden] { display: none !important; }

  /* Header */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 16px;
    padding: 12px clamp(12px, 4vw, 40px);
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .logo { font-weight: 800; font-size: 1.25rem; color: var(--brand); white-space: nowrap; }
  .search { flex: 1; max-width: 520px; }
  .search input {
    width: 100%; padding: 10px 14px;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--bg);
  }
  .cart-btn {
    position: relative; margin-left: auto;
    padding: 10px 16px; border: 1px solid var(--line);
    border-radius: 999px; background: var(--surface);
  }
  .badge {
    position: absolute; top: -6px; right: -6px;
    min-width: 22px; height: 22px; padding: 0 6px;
    display: grid; place-items: center;
    border-radius: 999px; background: var(--brand); color: var(--brand-text);
    font-size: .75rem; font-weight: 700;
  }

  /* Hero + toolbar */
  .hero { padding: 40px clamp(12px, 4vw, 40px) 8px; }
  .hero h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
    padding: 16px clamp(12px, 4vw, 40px);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface);
  }
  .chip.active { background: var(--brand); color: var(--brand-text); border-color: var(--brand); }
  .toolbar select {
    padding: 8px 12px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--surface);
  }

  /* Product grid */
  .grid {
    display: grid; gap: 20px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    padding: 8px clamp(12px, 4vw, 40px) 60px;
  }
  .card {
    display: flex; flex-direction: column; gap: 6px;
    padding: 14px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 16px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
  .thumb {
    display: grid; place-items: center; height: 150px;
    font-size: 3.6rem; border-radius: 12px;
    background: linear-gradient(135deg, rgba(79,70,229,.15), rgba(16,185,129,.15));
  }
  .card h3 { font-size: 1rem; margin-top: 6px; }
  .meta { font-size: .85rem; color: var(--muted); }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 8px; }
  .price { font-weight: 700; font-size: 1.1rem; }
  .primary {
    padding: 9px 14px; border: 0; border-radius: 10px;
    background: var(--brand); color: var(--brand-text); font-weight: 600;
  }
  .primary:disabled { opacity: .45; cursor: not-allowed; }
  .ghost { padding: 9px 14px; border: 1px solid var(--line); border-radius: 10px; background: transparent; }
  .empty { grid-column: 1 / -1; text-align: center; padding: 60px 0; color: var(--muted); }

  /* Cart drawer */
  .overlay { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.45); }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 30;
    width: min(100vw, 400px);
    display: flex; flex-direction: column;
    background: var(--surface); box-shadow: var(--shadow);
    transform: translateX(100%); transition: transform .25s ease;
  }
  .drawer.open { transform: translateX(0); }
  .drawer header, .drawer footer { padding: 16px 20px; }
  .drawer header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
  .drawer footer { border-top: 1px solid var(--line); }
  .close { border: 0; background: transparent; font-size: 1.4rem; line-height: 1; }
  .lines { flex: 1; overflow-y: auto; padding: 8px 20px; }
  .line { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .line .ico { font-size: 1.8rem; text-align: center; }
  .line .name { font-weight: 600; font-size: .95rem; }
  .qty { display: inline-flex; align-items: center; gap: 8px; margin-top: 4px; }
  .qty button {
    width: 26px; height: 26px; border-radius: 8px;
    border: 1px solid var(--line); background: transparent;
  }
  .remove { border: 0; background: transparent; color: var(--muted); font-size: .8rem; text-decoration: underline; }
  .totals div { display: flex; justify-content: space-between; padding: 2px 0; }
  .totals .grand { font-weight: 800; font-size: 1.1rem; margin-top: 6px; }
  .drawer footer .primary { width: 100%; margin-top: 12px; padding: 12px; }

  /* Checkout dialog */
  dialog {
    margin: auto; padding: 24px; width: min(92vw, 440px);
    border: 1px solid var(--line); border-radius: 16px;
    background: var(--surface); color: var(--text);
  }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog h2 { margin-bottom: 4px; }
  dialog label { display: block; margin-top: 12px; font-size: .9rem; font-weight: 600; }
  dialog input, dialog textarea {
    display: block; width: 100%; margin-top: 4px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
  }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 24px; z-index: 40;
    transform: translateX(-50%) translateY(20px); opacity: 0;
    padding: 10px 18px; border-radius: 999px;
    background: var(--text); color: var(--bg);
    transition: opacity .2s ease, transform .2s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">Shopwise</div>
  <div class="search">
    <input id="search" type="search" placeholder="Search products..." aria-label="Search products">
  </div>
  <button class="cart-btn" id="openCart" aria-label="Open cart">
    Cart <span class="badge" id="badge">0</span>
  </button>
</header>

<section class="hero">
  <h1>Everything you need, delivered.</h1>
  <p class="muted">Free shipping on orders over $100.</p>
</section>

<div class="toolbar">
  <div class="chips" id="chips"></div>
  <select id="sort" aria-label="Sort products">
    <option value="featured">Featured</option>
    <option value="price-asc">Price: low to high</option>
    <option value="price-desc">Price: high to low</option>
    <option value="rating">Top rated</option>
  </select>
</div>

<main class="grid" id="grid" aria-live="polite"></main>

<div class="overlay" id="overlay" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Shopping cart">
  <header>
    <h2>Your cart</h2>
    <button class="close" id="closeCart" aria-label="Close cart">&times;</button>
  </header>
  <div class="lines" id="lines"></div>
  <footer>
    <div class="totals" id="totals"></div>
    <button class="primary" id="checkoutBtn">Checkout</button>
  </footer>
</aside>

<dialog id="checkout" aria-labelledby="coTitle">
  <div id="coForm">
    <h2 id="coTitle">Checkout</h2>
    <p class="muted" id="coSummary"></p>
    <form id="orderForm">
      <label>Full name
        <input name="name" required autocomplete="name">
      </label>
      <label>Email
        <input name="email" type="email" required autocomplete="email">
      </label>
      <label>Delivery address
        <textarea name="address" rows="3" required autocomplete="street-address"></textarea>
      </label>
      <div class="actions">
        <button type="button" class="ghost" id="coCancel">Cancel</button>
        <button type="submit" class="primary">Place order</button>
      </div>
    </form>
  </div>
  <div id="coDone" hidden>
    <h2>Thank you!</h2>
    <p>Your order <strong id="orderNo"></strong> has been placed.</p>
    <p class="muted">This is a demo: no payment was taken.</p>
    <div class="actions"><button class="primary" id="coClose">Continue shopping</button></div>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  'use strict';

  var CURRENCY = 'USD';
  var FREE_SHIPPING_AT = 100;
  var SHIPPING_FEE = 5.99;
  var STORE_KEY = 'shop_cart_v1';
  var money = new Intl.NumberFormat('en-US', { style: 'currency', currency: CURRENCY });

  // Replace this array with a fetch() to your products API when you have a backend.
  var PRODUCTS = [
    { id: 1,  name: 'Wireless Headphones', cat: 'Electronics', price: 79.99,  icon: '🎧', rating: 4.6 },
    { id: 2,  name: 'Smart Watch',         cat: 'Electronics', price: 129.00, icon: '⌚', rating: 4.4 },
    { id: 3,  name: 'Bluetooth Speaker',   cat: 'Electronics', price: 49.50,  icon: '🔊', rating: 4.5 },
    { id: 4,  name: 'Running Shoes',       cat: 'Fashion',     price: 89.00,  icon: '👟', rating: 4.7 },
    { id: 5,  name: 'Denim Jacket',        cat: 'Fashion',     price: 64.90,  icon: '🧥', rating: 4.2 },
    { id: 6,  name: 'Everyday Backpack',   cat: 'Fashion',     price: 45.00,  icon: '🎒', rating: 4.5 },
    { id: 7,  name: 'Ceramic Mug Set',     cat: 'Home',        price: 24.99,  icon: '☕', rating: 4.8 },
    { id: 8,  name: 'Desk Lamp',           cat: 'Home',        price: 34.00,  icon: '💡', rating: 4.3 },
    { id: 9,  name: 'Indoor Plant',        cat: 'Home',        price: 18.50,  icon: '🪴', rating: 4.6 },
    { id: 10, name: 'Yoga Mat',            cat: 'Sports',      price: 29.99,  icon: '🧘', rating: 4.4 },
    { id: 11, name: 'Water Bottle',        cat: 'Sports',      price: 19.99,  icon: '🧴', rating: 4.5 },
    { id: 12, name: 'Mechanical Keyboard', cat: 'Electronics', price: 99.00,  icon: '⌨️', rating: 4.7 }
  ];

  function $(sel) { return document.querySelector(sel); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function byId(id) {
    for (var i = 0; i < PRODUCTS.length; i++) if (PRODUCTS[i].id === id) return PRODUCTS[i];
    return null;
  }

  // ---------- Cart persistence ----------
  function loadCart() {
    var clean = {};
    try {
      var raw = localStorage.getItem(STORE_KEY);
      var parsed = raw ? JSON.parse(raw) : {};
      Object.keys(parsed || {}).forEach(function (k) {
        var id = parseInt(k, 10), q = parseInt(parsed[k], 10);
        if (byId(id) && q > 0) clean[id] = q;
      });
    } catch (e) { /* storage unavailable: start empty */ }
    return clean;
  }
  function saveCart() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state.cart)); } catch (e) {}
  }

  var state = { query: '', cat: 'All', sort: 'featured', cart: loadCart() };
  var categories = ['All'];
  PRODUCTS.forEach(function (p) { if (categories.indexOf(p.cat) === -1) categories.push(p.cat); });

  // ---------- Rendering ----------
  function renderChips() {
    $('#chips').innerHTML = categories.map(function (c) {
      var on = c === state.cat;
      return '<button class="chip' + (on ? ' active' : '') + '" data-cat="' + esc(c) +
             '" aria-pressed="' + on + '">' + esc(c) + '</button>';
    }).join('');
  }

  function visibleProducts() {
    var q = state.query.trim().toLowerCase();
    var list = PRODUCTS.filter(function (p) {
      return (state.cat === 'All' || p.cat === state.cat) &&
             (!q || p.name.toLowerCase().indexOf(q) !== -1);
    });
    if (state.sort === 'price-asc') list.sort(function (a, b) { return a.price - b.price; });
    if (state.sort === 'price-desc') list.sort(function (a, b) { return b.price - a.price; });
    if (state.sort === 'rating') list.sort(function (a, b) { return b.rating - a.rating; });
    return list;
  }

  function renderProducts() {
    var list = visibleProducts();
    if (!list.length) {
      $('#grid').innerHTML = '<p class="empty">No products match your search.</p>';
      return;
    }
    $('#grid').innerHTML = list.map(function (p) {
      return '<article class="card">' +
        '<div class="thumb" aria-hidden="true">' + p.icon + '</div>' +
        '<h3>' + esc(p.name) + '</h3>' +
        '<p class="meta">' + esc(p.cat) + ' &middot; &#9733; ' + p.rating.toFixed(1) + '</p>' +
        '<div class="row"><span class="price">' + money.format(p.price) + '</span>' +
        '<button class="primary" data-add="' + p.id + '">Add to cart</button></div>' +
      '</article>';
    }).join('');
  }

  function cartLines() {
    return Object.keys(state.cart).map(function (k) {
      var p = byId(parseInt(k, 10));
      return { p: p, qty: state.cart[k] };
    }).filter(function (l) { return l.p; });
  }

  function totals() {
    var subtotal = cartLines().reduce(function (s, l) { return s + l.p.price * l.qty; }, 0);
    var shipping = subtotal === 0 ? 0 : (subtotal >= FREE_SHIPPING_AT ? 0 : SHIPPING_FEE);
    return { subtotal: subtotal, shipping: shipping, total: subtotal + shipping };
  }

  function renderCart() {
    var lines = cartLines();
    var count = lines.reduce(function (s, l) { return s + l.qty; }, 0);
    $('#badge').textContent = count;
    $('#badge').hidden = count === 0;

    $('#lines').innerHTML = lines.length ? lines.map(function (l) {
      return '<div class="line">' +
        '<div class="ico" aria-hidden="true">' + l.p.icon + '</div>' +
        '<div><div class="name">' + esc(l.p.name) + '</div>' +
          '<div class="qty">' +
            '<button data-dec="' + l.p.id + '" aria-label="Decrease quantity">&minus;</button>' +
            '<span>' + l.qty + '</span>' +
            '<button data-inc="' + l.p.id + '" aria-label="Increase quantity">+</button>' +
          '</div></div>' +
        '<div style="text-align:right"><div>' + money.format(l.p.price * l.qty) + '</div>' +
          '<button class="remove" data-remove="' + l.p.id + '">Remove</button></div>' +
      '</div>';
    }).join('') : '<p class="muted" style="padding:24px 0">Your cart is empty.</p>';

    var t = totals();
    $('#totals').innerHTML =
      '<div><span>Subtotal</span><span>' + money.format(t.subtotal) + '</span></div>' +
      '<div><span>Shipping</span><span>' + (t.shipping ? money.format(t.shipping) : 'Free') + '</span></div>' +
      '<div class="grand"><span>Total</span><span>' + money.format(t.total) + '</span></div>';
    $('#checkoutBtn').disabled = lines.length === 0;
  }

  // ---------- Cart actions ----------
  function toast(msg) {
    var el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast.t);
    toast.t = setTimeout(function () { el.classList.remove('show'); }, 1500);
  }
  function addToCart(id) {
    state.cart[id] = (state.cart[id] || 0) + 1;
    saveCart(); renderCart();
    toast(byId(id).name + ' added to cart');
  }
  function changeQty(id, delta) {
    var q = (state.cart[id] || 0) + delta;
    if (q <= 0) delete state.cart[id]; else state.cart[id] = q;
    saveCart(); renderCart();
  }
  function removeFromCart(id) {
    delete state.cart[id];
    saveCart(); renderCart();
  }

  // ---------- Drawer ----------
  function openDrawer() {
    $('#drawer').classList.add('open');
    $('#drawer').setAttribute('aria-hidden', 'false');
    $('#overlay').hidden = false;
  }
  function closeDrawer() {
    $('#drawer').classList.remove('open');
    $('#drawer').setAttribute('aria-hidden', 'true');
    $('#overlay').hidden = true;
  }

  // ---------- Checkout ----------
  var dlg = $('#checkout');
  function openCheckout() {
    $('#coForm').hidden = false;
    $('#coDone').hidden = true;
    $('#coSummary').textContent = 'Order total: ' + money.format(totals().total);
    closeDrawer();
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  }
  function closeCheckout() {
    if (dlg.close) dlg.close(); else dlg.removeAttribute('open');
  }
  $('#orderForm').addEventListener('submit', function (e) {
    e.preventDefault();
    // Demo only. In production, POST the cart and form to your server,
    // create a payment session (Stripe, Paystack, Flutterwave...) and redirect.
    $('#orderNo').textContent = 'ORD-' + Date.now().toString(36).toUpperCase();
    state.cart = {};
    saveCart(); renderCart();
    e.target.reset();
    $('#coForm').hidden = true;
    $('#coDone').hidden = false;
  });
  $('#coCancel').addEventListener('click', closeCheckout);
  $('#coClose').addEventListener('click', closeCheckout);

  // ---------- Events ----------
  $('#grid').addEventListener('click', function (e) {
    var b = e.target.closest('[data-add]');
    if (b) addToCart(parseInt(b.dataset.add, 10));
  });
  $('#chips').addEventListener('click', function (e) {
    var b = e.target.closest('[data-cat]');
    if (!b) return;
    state.cat = b.dataset.cat;
    renderChips(); renderProducts();
  });
  $('#lines').addEventListener('click', function (e) {
    var inc = e.target.closest('[data-inc]'), dec = e.target.closest('[data-dec]'), rem = e.target.closest('[data-remove]');
    if (inc) changeQty(parseInt(inc.dataset.inc, 10), 1);
    else if (dec) changeQty(parseInt(dec.dataset.dec, 10), -1);
    else if (rem) removeFromCart(parseInt(rem.dataset.remove, 10));
  });
  $('#search').addEventListener('input', function (e) { state.query = e.target.value; renderProducts(); });
  $('#sort').addEventListener('change', function (e) { state.sort = e.target.value; renderProducts(); });
  $('#openCart').addEventListener('click', openDrawer);
  $('#closeCart').addEventListener('click', closeDrawer);
  $('#overlay').addEventListener('click', closeDrawer);
  $('#checkoutBtn').addEventListener('click', openCheckout);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });

  // ---------- Init ----------
  renderChips();
  renderProducts();
  renderCart();
})();
</script>
</body>
</html>
